<!doctype html>

     (iOS needs an opaque square PNG). Rendered by scripts/render-share-image.sh. -->

<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; inline-size: 180px; block-size: 180px; overflow: hidden; }
    body { display: grid; place-items: center; background: oklch(0.975 0.012 90); }
    img { inline-size: 120px; block-size: 120px; }
  </style>
</head>
<body>
  <img src="../site/favicon.svg" alt="">
</body>
</html>
